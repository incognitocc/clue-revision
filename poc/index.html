<!doctype html>
<!-- ds-sense 產出 -->
<html lang="zh-Hant-TW" data-theme="clue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clue</title>
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <!-- DS 套件（@dsc-ai-project/tokens）未能安裝，暫以本機 Wonder DS tokens ＋ bridge 提供語意角色；見 README -->
  <link rel="stylesheet" href="vendor/wonder-ds/tokens/index.css">
  <link rel="stylesheet" href="styles/bridge.css">
  <link rel="stylesheet" href="styles/theme-clue.css">
  <link rel="stylesheet" href="styles/app.css?v=20261015-2">
  <script type="module" src="js/main.js?v=20261015-2"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="app-header">
    <div class="app-header__left">
      <img class="app-header__dentsu" src="vendor/wonder-ds/logo/dentsu-wordmark.svg" alt="dentsu" width="80" height="17">
      <a class="app-header__product" href="#/" aria-label="Clue 首頁（社群口碑分析）"><img src="assets/clue-logo.svg" alt="Clue" width="79" height="28"></a>
      <button type="button" class="shell-btn shell-btn--icon app-header__switch" id="app-switch-toggle" aria-haspopup="dialog" aria-expanded="false" aria-controls="app-switcher" aria-label="切換 dentsu 工具">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="app-header__right">
      <button type="button" class="shell-btn app-header__action" id="feedback-toggle" aria-label="意見回饋">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8l-6 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/></svg>
        <span class="app-header__feedback-label">意見回饋</span>
      </button>
      <button type="button" class="shell-btn app-header__action" id="notifications-toggle" aria-label="通知">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4M12 2V1"/></svg>
      </button>
      <span class="app-header__user"><span class="app-header__name">林示範</span><span class="avatar avatar--shell" aria-hidden="true">林</span></span>
      <button type="button" class="shell-btn shell-btn--icon" id="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="開啟 Clue 選單">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>


  <div class="app-body">

    <nav class="main-nav" id="main-nav" aria-label="Clue 主選單">
      <video class="main-nav__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
        <source src="assets/clue-leftside-bg.mp4" type="video/mp4">
      </video>
      <button type="button" class="main-nav__collapse" id="sidebar-toggle" aria-expanded="true" aria-controls="main-nav-links recent-block" aria-label="收合側邊選單" title="收合側邊選單">
        <svg class="icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <ul class="main-nav__links" id="main-nav-links">
        <li><a href="#/" data-nav="work">社群口碑分析</a></li>
        <li><a href="#/opview" data-nav="opview">OpView 社群資料索取</a></li>
        <li><a href="#/explore" data-nav="explore">OpView 即時探索</a></li>
        <li><a href="#/guide" data-nav="guide">使用指南</a></li>
      </ul>
      <div class="main-nav__recent-block" id="recent-block" hidden>
        <h2 class="main-nav__heading">最近開啟</h2>
        <ul id="recent-list" class="main-nav__recent-list"></ul>
      </div>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

  <footer class="app-footer">
    <img class="app-footer__brand" src="assets/dentsupro-logo-gradient.png" alt="dentsu pro" width="107" height="23">
    <div class="app-footer__links">
      <img class="app-footer__dentsu" src="vendor/wonder-ds/logo/dentsu-wordmark.svg" alt="dentsu" width="72" height="15">
      <a href="#/terms" class="app-footer__terms">Terms and conditions</a>
    </div>
  </footer>

  <dialog class="app-switcher" id="app-switcher" aria-labelledby="app-switcher-title">
    <div class="app-switcher__head">
      <h2 class="app-switcher__title" id="app-switcher-title">切換 dentsu 工具</h2>
      <button type="button" class="icon-btn" data-action="close-switcher" aria-label="關閉">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="app-switcher__grid">
        <li><button type="button" class="app-switcher__item" data-app="AI Media"><span class="app-switcher__tile" aria-hidden="true">AM</span><span class="app-switcher__label">AI Media</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="AI Creative"><span class="app-switcher__tile" aria-hidden="true">AC</span><span class="app-switcher__label">AI Creative</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="AutoResponder"><span class="app-switcher__tile" aria-hidden="true">AR</span><span class="app-switcher__label">Auto<wbr>Responder</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="Clue" aria-current="true"><span class="app-switcher__tile" aria-hidden="true">C</span><span class="app-switcher__label">Clue</span><span class="app-switcher__here">目前所在</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="Finbook"><span class="app-switcher__tile" aria-hidden="true">F</span><span class="app-switcher__label">Finbook</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="Leon"><span class="app-switcher__tile" aria-hidden="true">L</span><span class="app-switcher__label">Leon</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="Personas"><span class="app-switcher__tile" aria-hidden="true">P</span><span class="app-switcher__label">Personas</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="TrenDex"><span class="app-switcher__tile" aria-hidden="true">T</span><span class="app-switcher__label">TrenDex</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="Wonder"><span class="app-switcher__tile" aria-hidden="true">W</span><span class="app-switcher__label">Wonder</span></button></li>
        <li><button type="button" class="app-switcher__item" data-app="Writer"><span class="app-switcher__tile" aria-hidden="true">Wr</span><span class="app-switcher__label">Writer</span></button></li>
    </ul>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="sr-status" class="sr-only" aria-live="polite"></div>
</body>
</html>
